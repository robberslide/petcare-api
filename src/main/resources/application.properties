# ============================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ============================================================
spring.application.name=petcare
# Puerto donde queda escuchando la API -> http://localhost:8080
server.port=8080

# ===== Base de datos H2 (en memoria) =====
# H2 vive en la RAM: no hay que instalar nada, pero los datos se borran
# cada vez que se reinicia la aplicación.
spring.datasource.url=jdbc:h2:mem:petcare
spring.datasource.username=sa
spring.datasource.password=
# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== MySQL (alternativa si quieren datos persistentes) =====
# spring.datasource.url=jdbc:mysql://localhost:3306/petcare?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=tu_clave

# ===== JPA / Hibernate =====
# update: Hibernate crea/actualiza las tablas automáticamente a partir de las
# clases @Entity (no escribimos CREATE TABLE a mano).
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que Hibernate genera (útil para explicar qué pasa)
spring.jpa.show-sql=true
# Buena práctica: cierra la conexión a la BD al terminar el Service,
# no la mantiene abierta hasta que se arma la respuesta HTTP.
spring.jpa.open-in-view=false
